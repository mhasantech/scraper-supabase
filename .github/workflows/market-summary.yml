name: DSE Market Summary

on:
  workflow_dispatch:

concurrency:
  group: stockpulse-market-pipeline-${{ github.ref }}
  cancel-in-progress: false

jobs:
  market-summary:
    runs-on: ubuntu-latest
    timeout-minutes: 15

    steps:
      - name: Checkout
        uses: actions/checkout@v4

      - name: Setup Node.js
        uses: actions/setup-node@v4
        with:
          node-version: '20'

      - name: Install dependencies
        run: npm install --no-audit --no-fund

      - name: Run Market Summary Scraper
        env:
          SUPABASE_URL: ${{ secrets.SUPABASE_URL }}
          SUPABASE_SERVICE_KEY: ${{ secrets.SUPABASE_SERVICE_KEY }}
        run: node scripts/market_summary_scraper.js

      - name: Upload page copies if the scraper failed
        if: failure()
        uses: actions/upload-artifact@v4
        with:
          name: market-summary-debug
          path: debug/
          if-no-files-found: ignore
          retention-days: 3
