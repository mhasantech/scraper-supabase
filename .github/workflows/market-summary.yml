name: DSE Market Summary

on:
  schedule:
    - cron: '*/15 3-11 * * 0-4'
    - cron: '0 12 * * 0-4'
  workflow_dispatch:

jobs:
  market-summary:
    runs-on: ubuntu-latest
    timeout-minutes: 10

    steps:
      - name: Checkout
        uses: actions/checkout@v4

      - name: Setup Node.js
        uses: actions/setup-node@v4
        with:
          node-version: '20'

      - name: Install dependencies
        run: npm install

      - name: Run Market Summary Scraper
        env:
          SUPABASE_URL: ${{ secrets.SUPABASE_URL }}
          SUPABASE_SERVICE_KEY: ${{ secrets.SUPABASE_SERVICE_KEY }}
        run: node scripts/market_summary_scraper.js
