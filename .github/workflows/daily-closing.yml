name: StockPulse Daily Closing Prices

on:
  workflow_dispatch:

concurrency:
  group: stockpulse-market-pipeline-${{ github.ref }}
  cancel-in-progress: false

jobs:
  daily-closing:
    runs-on: ubuntu-latest
    timeout-minutes: 15
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: '20'
      - run: npm install --no-audit --no-fund
      - run: node scripts/update_daily_closing.js
        env:
          SUPABASE_URL: ${{ secrets.SUPABASE_URL }}
          SUPABASE_SERVICE_KEY: ${{ secrets.SUPABASE_SERVICE_KEY }}
