name: StockPulse Daily Closing Prices

on:
  schedule:
    # UTC 10:30 = Bangladesh 4:30 PM, Sunday-Thursday.
    - cron: '30 10 * * 0-4'
  workflow_dispatch:

concurrency:
  group: stockpulse-daily-closing-${{ github.ref }}
  cancel-in-progress: false

jobs:
  daily-closing:
    runs-on: ubuntu-latest
    timeout-minutes: 15
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: '20'
      - run: npm install
      - run: node scripts/update_daily_closing.js
        env:
          SUPABASE_URL: ${{ secrets.SUPABASE_URL }}
          SUPABASE_SERVICE_KEY: ${{ secrets.SUPABASE_SERVICE_KEY }}
