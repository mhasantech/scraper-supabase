name: StockPulse DSE Dividend History

on:
  workflow_dispatch:
    inputs:
      tickers:
        description: "Optional comma-separated ticker list (e.g. AAMRANET,ACIFORMULA). Leave blank for all DSE tickers."
        required: false
        type: string
  schedule:
    # Twice weekly at 18:30 Bangladesh time (UTC 12:30), Sunday and Tuesday.
    - cron: '30 12 * * 0,2'

concurrency:
  group: stockpulse-market-pipeline-${{ github.ref }}
  cancel-in-progress: false

jobs:
  scrape-dividends:
    runs-on: ubuntu-latest
    timeout-minutes: 30
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: '20'
      - run: npm install --no-audit --no-fund
      - name: Scrape dividend history from DSE legacy company pages
        env:
          SUPABASE_URL: ${{ secrets.SUPABASE_URL }}
          SUPABASE_SERVICE_KEY: ${{ secrets.SUPABASE_SERVICE_KEY }}
          DIVIDEND_TICKERS: ${{ github.event.inputs.tickers }}
          DIVIDEND_SCRAPE_DELAY_MS: '120'
          DIVIDEND_CONCURRENCY: '6'
        run: node scripts/dse_dividend_history_scraper.js
