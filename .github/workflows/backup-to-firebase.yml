name: StockPulse User Data Firebase Backup

on:
  schedule:
    # UTC 12:20 = Bangladesh 6:20 PM, after the final market jobs.
    - cron: '20 12 * * 0-4'
  workflow_dispatch:
    inputs:
      mode:
        description: 'Backup mode (both modes back up user/business data only)'
        required: true
        default: 'daily'
        type: choice
        options:
          - daily
          - full

jobs:
  backup:
    runs-on: ubuntu-latest
    timeout-minutes: 30
    env:
      FORCE_JAVASCRIPT_ACTIONS_TO_NODE24: true

    steps:
      - name: Checkout
        uses: actions/checkout@v4

      - name: Setup Node.js
        uses: actions/setup-node@v4
        with:
          node-version: '20'

      - name: Install dependencies
        run: npm install

      - name: Backup user and business data to Firebase
        env:
          SUPABASE_URL: ${{ secrets.SUPABASE_URL }}
          SUPABASE_SERVICE_KEY: ${{ secrets.SUPABASE_SERVICE_KEY }}
          FIREBASE_SERVICE_ACCOUNT_KEY: ${{ secrets.FIREBASE_SERVICE_ACCOUNT_KEY }}
          BACKUP_MODE: ${{ github.event.inputs.mode || 'daily' }}
        run: node scripts/backup_supabase_to_firebase.js
