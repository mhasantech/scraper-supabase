name: Update Historical Closing Data (Weekly)

on:
  schedule:
    # প্রতি রবিবার UTC ০০:০০ টায় (বাংলাদেশ সময় সকাল ৬:০০)
    # পরিবর্তন করতে চাইলে cron ফর্ম্যাট পরিবর্তন করুন
    - cron: '0 0 * * 0'
  workflow_dispatch:
    # ম্যানুয়ালি রান করাতে চাইলে GitHub Actions-এর ড্যাশবোর্ড থেকে রান করান

jobs:
  update-historical:
    runs-on: ubuntu-latest
    timeout-minutes: 60  # অনেক ডেটা আনার জন্য সময় বেশি লাগতে পারে
    env:
      FORCE_JAVASCRIPT_ACTIONS_TO_NODE24: true

    steps:
      - name: Checkout Code
        uses: actions/checkout@v4

      - name: Setup Node.js
        uses: actions/setup-node@v4
        with:
          node-version: '20'

      - name: Install Dependencies
        run: npm install

      - name: Run Historical Data Updater
        env:
          SUPABASE_SERVICE_KEY: ${{ secrets.SUPABASE_SERVICE_KEY }}
        run: node scripts/update_historical_closing.js

      - name: Completion Message
        run: echo "✅ হিস্টোরিক্যাল ডেটা আপডেট সম্পন্ন হয়েছে!"
