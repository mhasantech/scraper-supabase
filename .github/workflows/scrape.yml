name: Market Scraper (CSE + DSE + DSEX)

on:
  schedule:
    # UTC ৩:০০ থেকে ১১:৫৯ পর্যন্ত প্রতি ১৫ মিনিটে (বাংলাদেশ সকাল ৯টা – বিকাল ৫:৫৯)
    - cron: '*/15 3-11 * * 0-4'
    # UTC ১২:০০ তে একবার (বাংলাদেশ বিকাল ৬টা) – শেষ দামটি ধরা
    - cron: '0 12 * * 0-4'
  workflow_dispatch: # ম্যানুয়াল রান (যেকোনো সময় করবেন)

concurrency:
  group: stockpulse-market-scrape-${{ github.ref }}
  cancel-in-progress: false

jobs:
  scrape:
    runs-on: ubuntu-latest
    timeout-minutes: 20
    env:
      FORCE_JAVASCRIPT_ACTIONS_TO_NODE24: true

    steps:
      - name: Checkout Code
        uses: actions/checkout@v4

      - name: Setup Node.js
        uses: actions/setup-node@v4
        with:
          node-version: '20'

      - name: Install Dependencies
        run: npm install

      - name: Run CSE Scraper
        env:
          SUPABASE_SERVICE_KEY: ${{ secrets.SUPABASE_SERVICE_KEY }}
        run: node scripts/cse_scraper.js

      - name: Run DSE Scraper (Current DSE Website)
        env:
          SUPABASE_SERVICE_KEY: ${{ secrets.SUPABASE_SERVICE_KEY }}
        run: node scripts/dse_scraper.js

      - name: Run DSEX Scraper
        env:
          SUPABASE_SERVICE_KEY: ${{ secrets.SUPABASE_SERVICE_KEY }}
        run: node scripts/dsex_scraper.js

      - name: Upload page copies if a scraper failed
        if: failure()
        uses: actions/upload-artifact@v4
        with:
          name: scrape-debug
          path: debug/
          if-no-files-found: ignore
          retention-days: 3

  daily-closing:
    runs-on: ubuntu-latest
    if: always() && (github.event_name == 'workflow_dispatch')
    timeout-minutes: 10

    steps:
      - name: Checkout Code
        uses: actions/checkout@v4

      - name: Setup Node.js
        uses: actions/setup-node@v4
        with:
          node-version: '20'

      - name: Install Dependencies
        run: npm install

      - name: Update Daily Closing Prices (CSE)
        env:
          SUPABASE_SERVICE_KEY: ${{ secrets.SUPABASE_SERVICE_KEY }}
        run: node scripts/update_daily_closing.js
