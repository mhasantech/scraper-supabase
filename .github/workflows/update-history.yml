name: Update DSE History (Daily)

on:
  schedule:
    # UTC 10:30 = Bangladesh 4:30 PM (Sunday-Thursday)
    - cron: '30 10 * * 0-4'
  workflow_dispatch:

jobs:
  update-history:
    runs-on: ubuntu-latest
    timeout-minutes: 60
    env:
      FORCE_JAVASCRIPT_ACTIONS_TO_NODE24: true
      SUPABASE_URL: ${{ secrets.SUPABASE_URL }}
      SUPABASE_SERVICE_KEY: ${{ secrets.SUPABASE_SERVICE_KEY }}

    steps:
      - name: Checkout Code
        uses: actions/checkout@v4

      - name: Setup Node.js
        uses: actions/setup-node@v4
        with:
          node-version: '22'

      - name: Setup Python
        uses: actions/setup-python@v5
        with:
          python-version: '3.11'

      - name: Install Node Dependencies
        run: npm install

      - name: Install DSE Historical Scraper
        run: python -m pip install --upgrade pip && python -m pip install -r requirements.txt

      - name: Run DSE History Updater
        run: node scripts/update_dse_history.js

      - name: Precompute Stock Indicators
        run: node scripts/precompute_indicators.js

      - name: Completion Message
        run: echo "✅ DSE history + pre-calculated stock indicators updated!"
